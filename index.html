<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구름 AI 판별기 | 맑은 구름 vs 비구름</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* Glassmorphism visual card styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Active drag-over hover effect */
        .drag-over {
            border-color: #3b82f6 !important;
            background-color: rgba(239, 246, 255, 0.85) !important;
            transform: scale(1.01);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-100 via-sky-50 to-indigo-100 min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6 md:p-8">

    <header class="max-w-2xl mx-auto w-full text-center mt-4 mb-6">
        <div class="inline-flex items-center justify-center p-3 bg-white/80 rounded-full shadow-sm mb-3 border border-sky-100">
            <i class="fa-solid text-sky-500 text-2xl fa-cloud-sun mr-2"></i>
            <span class="text-xs font-semibold text-sky-600 tracking-wider uppercase">Teachable Machine AI</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight mb-2">
            구름 AI 판별기
        </h1>
        <p class="text-slate-600 text-sm sm:text-base">
            구름 사진을 올리면 AI가 <span class="text-sky-600 font-semibold">맑은 구름</span>인지 <span class="text-indigo-600 font-semibold">비구름</span>인지 분석해 드립니다.
        </p>
    </header>

    <main class="max-w-xl mx-auto w-full mb-auto">
        <!-- Model Loading Banner -->
        <div id="model-loader" class="glass-card rounded-2xl p-4 mb-6 shadow-sm flex items-center justify-between border-l-4 border-l-sky-500 transition-all duration-300">
            <div class="flex items-center space-x-3">
                <i id="loader-icon" class="fa-solid fa-spinner fa-spin text-sky-500 text-xl"></i>
                <div>
                    <p id="loader-title" class="text-sm font-semibold text-slate-700">AI 모델 로딩 중...</p>
                    <p id="loader-desc" class="text-xs text-slate-500">인공지능 신경망 모델을 가동하고 있습니다.</p>
                </div>
            </div>
        </div>

        <!-- Main Interactive Workspace -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl transition-all duration-300">
            
            <div id="upload-container" class="space-y-4">
                <div id="drop-zone" class="border-2 border-dashed border-sky-200 hover:border-sky-400 bg-sky-50/50 rounded-2xl p-8 text-center cursor-pointer transition-all duration-200 flex flex-col items-center justify-center min-h-[220px]">
                    <input type="file" id="image-input" accept="image/*" class="hidden" disabled>
                    <div class="w-16 h-16 bg-sky-100 text-sky-500 rounded-full flex items-center justify-center mb-4 text-2xl shadow-inner">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <p class="text-base font-medium text-slate-700 mb-1">
                        사진을 드래그하여 놓거나 <span class="text-sky-600 underline decoration-sky-300 font-semibold">클릭하여 선택</span>
                    </p>
                    <p class="text-xs text-slate-400">JPG, PNG, WEBP 등 이미지 파일 자동 분석</p>
                </div>
            </div>

            <div id="result-container" class="hidden space-y-6">
                <!-- Preview Image Display -->
                <div class="relative rounded-2xl overflow-hidden bg-slate-900 shadow-md max-h-[300px] flex items-center justify-center">
                    <img id="preview-image" src="" alt="구름 이미지 미리보기" class="w-full h-full object-contain max-h-[300px]">
                    <div id="predicting-badge" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center text-white space-y-2">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-400"></i>
                        <span class="text-sm font-medium">구름 분류 실시간 분석 중...</span>
                    </div>
                </div>

                <!-- Top AI Prediction Banner -->
                <div id="top-result-card" class="hidden rounded-2xl p-5 text-center transition-all duration-300">
                    <span id="result-badge" class="inline-block px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider mb-2"></span>
                    <h2 id="result-title" class="text-2xl font-black text-slate-800"></h2>
                    <p id="result-subtitle" class="text-xs text-slate-500 mt-1"></p>
                </div>

                <!-- Probability Detail Chart -->
                <div id="probability-section" class="hidden space-y-4 pt-2 border-t border-slate-100">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">분석 상세 신뢰도</h3>
                    
                    <div id="label-container" class="space-y-3">
                        <!-- Dynamic prediction bars injected via JavaScript -->
                    </div>
                </div>

                <!-- Reset Button -->
                <button id="reset-btn" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>다른 구름 사진 검사하기</span>
                </button>
            </div>

        </div>
    </main>

    <footer class="max-w-2xl mx-auto w-full text-center mt-8 text-xs text-slate-500 space-y-1">
        <p>Powered by <a href="https://teachablemachine.withgoogle.com/" target="_blank" class="text-sky-600 hover:underline">Google Teachable Machine</a> & TensorFlow.js</p>
        <p>GitHub Pages 호스팅 전용 싱글 페이지 웹 앱</p>
    </footer>

    <script>
        // Teachable Machine Model URL
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/OsOTdyCT7/";
        let model, maxPredictions;

        // DOM elements
        const modelLoader = document.getElementById('model-loader');
        const loaderIcon = document.getElementById('loader-icon');
        const loaderTitle = document.getElementById('loader-title');
        const loaderDesc = document.getElementById('loader-desc');

        const dropZone = document.getElementById('drop-zone');
        const imageInput = document.getElementById('image-input');
        const uploadContainer = document.getElementById('upload-container');

        const resultContainer = document.getElementById('result-container');
        const previewImage = document.getElementById('preview-image');
        const predictingBadge = document.getElementById('predicting-badge');
        const topResultCard = document.getElementById('top-result-card');
        const resultBadge = document.getElementById('result-badge');
        const resultTitle = document.getElementById('result-title');
        const resultSubtitle = document.getElementById('result-subtitle');
        const probabilitySection = document.getElementById('probability-section');
        const labelContainer = document.getElementById('label-container');
        const resetBtn = document.getElementById('reset-btn');

        async function loadModel() {
            try {
                const modelPath = MODEL_URL + "model.json";
                const metadataPath = MODEL_URL + "metadata.json";

                // Load Teachable Machine image classification model
                model = await tmImage.load(modelPath, metadataPath);
                maxPredictions = model.getTotalClasses();

                // UI update on successful model load
                loaderIcon.className = "fa-solid fa-circle-check text-emerald-500 text-xl";
                loaderTitle.textContent = "AI 모델 준비 완료!";
                loaderTitle.className = "text-sm font-semibold text-emerald-700";
                loaderDesc.textContent = "구름 사진을 올리시면 바로 분류해 드립니다.";
                modelLoader.className = "glass-card rounded-2xl p-4 mb-6 shadow-sm flex items-center justify-between border-l-4 border-l-emerald-500 transition-all duration-300";

                // Enable file upload
                imageInput.disabled = false;
            } catch (error) {
                console.error("Model Load Error:", error);
                loaderIcon.className = "fa-solid fa-triangle-exclamation text-rose-500 text-xl";
                loaderTitle.textContent = "AI 모델 로딩 실패";
                loaderTitle.className = "text-sm font-semibold text-rose-700";
                loaderDesc.textContent = "인터넷 연결 상태를 확인 후 다시 시도해 주세요.";
                modelLoader.className = "glass-card rounded-2xl p-4 mb-6 shadow-sm flex items-center justify-between border-l-4 border-l-rose-500 transition-all duration-300";
            }
        }

        dropZone.addEventListener('click', () => {
            if (!imageInput.disabled) imageInput.click();
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!imageInput.disabled) dropZone.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('drag-over');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                handleImageFile(files[0]);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleImageFile(e.target.files[0]);
            }
        });

        function handleImageFile(file) {
            if (!file.type.startsWith('image/')) {
                const messageBox = document.createElement('div');
                messageBox.className = "fixed top-4 right-4 bg-rose-600 text-white px-4 py-3 rounded-xl shadow-lg text-sm z-50 font-medium";
                messageBox.textContent = "이미지 파일(JPG, PNG 등)만 업로드 가능합니다.";
                document.body.appendChild(messageBox);
                setTimeout(() => messageBox.remove(), 3000);
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                previewImage.src = e.target.result;
                
                // Toggle display modes
                uploadContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                predictingBadge.classList.remove('hidden');
                topResultCard.classList.add('hidden');
                probabilitySection.classList.add('hidden');

                previewImage.onload = async function () {
                    setTimeout(async () => {
                        await predictCloud(previewImage);
                    }, 300);
                };
            };
            reader.readAsDataURL(file);
        }

        async function predictCloud(imageElement) {
            if (!model) return;

            // Model inference
            const predictions = await model.predict(imageElement);
            
            // Sort by confidence
            predictions.sort((a, b) => b.probability - a.probability);
            const topPrediction = predictions[0];

            const classNameLower = topPrediction.className.toLowerCase();
            const isSunnyCloud = topPrediction.className.includes("맑") || classNameLower.includes("sunny") || classNameLower.includes("clear");
            const topPercentage = (topPrediction.probability * 100).toFixed(1);

            if (isSunnyCloud) {
                topResultCard.className = "rounded-2xl p-5 text-center bg-amber-50 border border-amber-200 transition-all duration-300";
                resultBadge.className = "inline-block px-3 py-1 text-xs font-bold rounded-full bg-amber-200 text-amber-800 uppercase tracking-wider mb-2";
                resultBadge.innerHTML = '<i class="fa-solid fa-sun mr-1"></i> 맑은 하늘';
                resultTitle.textContent = `${topPrediction.className} (${topPercentage}%)`;
                resultTitle.className = "text-2xl font-black text-amber-900";
                resultSubtitle.textContent = "햇살이 비추는 맑고 화창한 구름 상태입니다.";
            } else {
                topResultCard.className = "rounded-2xl p-5 text-center bg-indigo-50 border border-indigo-200 transition-all duration-300";
                resultBadge.className = "inline-block px-3 py-1 text-xs font-bold rounded-full bg-indigo-200 text-indigo-800 uppercase tracking-wider mb-2";
                resultBadge.innerHTML = '<i class="fa-solid fa-cloud-showers-heavy mr-1"></i> 비구름 주의';
                resultTitle.textContent = `${topPrediction.className} (${topPercentage}%)`;
                resultTitle.className = "text-2xl font-black text-indigo-900";
                resultSubtitle.textContent = "먹구름이 끼어있거나 비가 올 가능성이 있는 구름입니다.";
            }

            // Render progress bars
            labelContainer.innerHTML = '';
            predictions.forEach((item) => {
                const percentage = (item.probability * 100).toFixed(1);
                const itemLower = item.className.toLowerCase();
                const isClear = item.className.includes("맑") || itemLower.includes("sunny") || itemLower.includes("clear");
                const barColor = isClear ? 'bg-amber-400' : 'bg-indigo-500';

                const classRow = document.createElement('div');
                classRow.className = "space-y-1";
                classRow.innerHTML = `
                    <div class="flex justify-between items-center text-xs sm:text-sm font-medium">
                        <span class="text-slate-700 flex items-center">
                            <i class="${isClear ? 'fa-solid fa-sun text-amber-500' : 'fa-solid fa-cloud-rain text-indigo-500'} mr-2"></i>
                            ${item.className}
                        </span>
                        <span class="font-bold text-slate-800">${percentage}%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200">
                        <div class="${barColor} h-full rounded-full transition-all duration-700 ease-out" style="width: ${percentage}%"></div>
                    </div>
                `;
                labelContainer.appendChild(classRow);
            });

            // Reveal results
            predictingBadge.classList.add('hidden');
            topResultCard.classList.remove('hidden');
            probabilitySection.classList.remove('hidden');
        }

        resetBtn.addEventListener('click', () => {
            imageInput.value = '';
            previewImage.src = '';
            resultContainer.classList.add('hidden');
            uploadContainer.classList.remove('hidden');
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', loadModel);
    </script>
</body>
</html>
